<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Test your knowledge in various subjects. Fun and educational quiz app!"/>
  <meta name="keywords" content="HellenicDev, programming, HTML, CSS, JS, open-source, projects, web-developement, hellenic, dev, developer, knowledge, subjects, The Quiz, fun, educational, quiz, science, food, drinks, sports, sport, geography, history, technology, music, movies"/>
  <meta name="author" content="HellenicDev"/>
  <meta name="theme-color" content="#19336e"/>
  <meta property="og:title" content="HellenicDev">
  <meta property="og:description" content="Programming projects, experiments, and tools by HellenicDev.">
  <meta property="og:image" content="https://hellenicdev.github.io/logo.webp">
  <meta property="og:url" content="https://hellenicdev.github.io">
  <meta property="og:type" content="website">
  <title>The Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a href="/">
    <img src="https://hellenicdev.github.io/logo.webp" alt="Logo" class="site-logo">
  </a>

  <h1>The Quiz 🎓</h1>

  <!-- Menu -->
  <div id="menu-container" class="screen container active">
    <h2>Select a topic:</h2>
    <button onclick="selectTopic('science')">🔬 Science</button>
    <button onclick="selectTopic('sports')">⚽ Sports</button>
    <button onclick="selectTopic('food')">🍔 Food & Drinks</button>
    <button onclick="selectTopic('geography')">🌎 Geography</button>
    <button onclick="selectTopic('history')">📜 History</button>
    <button onclick="selectTopic('technology')">💻 Technology</button>
    <button onclick="selectTopic('movies')">🎬 Movies</button>
    <button onclick="selectTopic('music')">🎵 Music</button>
    <button onclick="selectRandomTopic()" class="btn-success">🎲 Random Topic</button>
  </div>

  <!-- Difficulty -->
  <div id="difficulty-container" class="screen container">
    <h2>Select Difficulty:</h2>
    <p id="topic-label" style="color:#aaa;margin:0 0 10px;font-size:0.95rem;"></p>
    <button onclick="startQuiz('easy')">🌟 Easy (15s)</button>
    <button onclick="startQuiz('medium')">⚡ Medium (10s)</button>
    <button onclick="startQuiz('hard')">🔥 Hard (5s)</button>
    <button onclick="backToMenu()" class="btn-secondary btn-small" style="margin-top:16px;">← Back</button>
  </div>

  <!-- Quiz -->
  <div id="quiz-container" class="screen">
    <div class="container">
      <div class="quiz-info">
        <span id="q-topic"></span>
        <span id="q-difficulty"></span>
        <span id="q-score">Score: 0</span>
      </div>
      <div class="streak-display" id="q-streak"></div>
      <div class="progress-text" id="progress-text">Question 1 / 10</div>
      <div class="progress-dots" id="progress-dots"></div>
      <div class="timer-bar-track">
        <div class="timer-bar-fill" id="timer-bar" style="width:100%"></div>
      </div>
      <p id="timer-label" style="font-size:0.9rem;color:#aaa;margin:4px 0 10px;">⏱ 15s</p>
      <h3 id="question-text"></h3>
      <div id="answers-container"></div>
      <p class="keyboard-hint">⌨️ Press 1-4 to answer</p>
      <div id="feedback" style="display:none;"></div>
    </div>
  </div>

  <!-- End Screen -->
  <div id="end-screen" class="screen container">
    <h2>Quiz Complete! 🎉</h2>
    <p id="final-score" style="font-size:1.4rem;margin:10px 0;"></p>
    <p id="score-percent" style="font-size:1.1rem;color:#aaa;"></p>
    <p id="streak-info" style="font-size:1rem;color:#20c997;min-height:1.5em;"></p>
    <p style="font-size:0.95rem;color:#aaa;margin:10px 0 4px;">🏆 High Scores for this topic:</p>
    <ul class="high-scores-list" id="high-scores-list"></ul>

    <details style="margin:10px 0;">
      <summary style="cursor:pointer;color:#aaa;font-size:0.95rem;">📋 Review Answers</summary>
      <ul class="review-list" id="review-list"></ul>
    </details>

    <button onclick="backToMenu()">← Back to Menu</button>
    <button onclick="restartSameTopic()" class="btn-success">🔄 Try Again</button>
    <button id="share-btn" onclick="shareResult()" class="btn-share">📤 Share Result</button>
  </div>

  <div class="footer">
    © 2026 <a href="https://hellenicdev.github.io">HellenicDev</a> — All projects and content belong to HellenicDev.
  </div>

  <script src="script.js"></script>
</body>
</html>
